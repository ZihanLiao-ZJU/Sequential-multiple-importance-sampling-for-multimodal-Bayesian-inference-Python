[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semis-bayes"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "semcs-core @ git+https://github.com/ZihanLiao-ZJU/Sequential-multiple-importance-sampling-for-Reliability-Estimation-Python.git@28e0932bfcf3c7aa1e92f4ffb57a15f1d2b2bc29"]

[tool.setuptools.packages.find]
include = ["semis_bayes*"]
